name: Production Full-Stack Audit

on:
  pull_request:
    paths:
      - 'app.py'
      - 'ai_engine.py'
      - 'candidate_funnel.py'
      - 'preference_engine.py'
      - 'prompt_intelligence.py'
      - 'availability.py'
      - 'availability_v2.py'
      - 'verification/**'
      - 'static/**'
      - 'templates/**'
      - 'telegram_bootstrap.py'
      - '.github/workflows/full-stack-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-full-stack-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-stack-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Playwright browsers
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium webkit
      - name: Audit canonical Railway production
        env:
          NAMEMACHINE_PRODUCTION_URL: https://web-production-04fec.up.railway.app
        run: node verification/full_stack_audit.mjs
