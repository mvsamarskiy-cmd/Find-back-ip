name: Production Stream Concurrency Audit

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-stream-concurrency-main
  cancel-in-progress: true

jobs:
  stream-concurrency:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Wait for canonical Railway deployment
        if: github.event_name == 'push'
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
          BASE: https://web-production-04fec.up.railway.app
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            payload="$(curl -fsS --max-time 15 "$BASE/api/version" || true)"
            if python - "$EXPECTED_COMMIT" "$payload" <<'PY'
import json, sys
expected, payload = sys.argv[1], sys.argv[2]
try:
    data = json.loads(payload)
except Exception:
    raise SystemExit(1)
actual = str(data.get('git_commit') or '')
raise SystemExit(0 if actual and (actual == expected or actual.startswith(expected) or expected.startswith(actual)) else 1)
PY
            then
              exit 0
            fi
            sleep 15
          done
          echo "Canonical Railway deployment did not converge to $EXPECTED_COMMIT" >&2
          exit 1
      - name: Probe health while NDJSON stream is active
        env:
          NAMEMACHINE_PRODUCTION_URL: https://web-production-04fec.up.railway.app
        run: node verification/stream_concurrency_probe.mjs
