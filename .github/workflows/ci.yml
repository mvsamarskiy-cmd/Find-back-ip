name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python verification/check_inline_js.py
      - run: node --check static/streaming.js
      - run: node --check static/resource_progress.js
      - run: node --check static/session_sync.js
      - run: node --check static/background_search.js
      - run: node --check static/availability_hunter_ui.js
      - run: node --check static/audit_sync.js
      - run: node --check static/audit_report.js
      - run: node --check static/report_math_v6.js
      - run: node --check static/client_report.js
      - run: node --check static/client_report_modes.js
      - run: node --check static/report_math_overlay.js
      - run: node --check static/report_controls.js
      - run: node --check static/feed_navigation.js
      - run: node --check static/claimability_ui.js
      - run: node --check static/entry_modes.js
      - run: node --check static/brand_collision_ui.js
      - run: node --check static/durable_live_events.js
      - run: node --check static/ui_cleanup_r8.js
      - run: node --check static/variant_expansion_ui.js
      - run: node --check static/variant_expansion_sync.js
      - run: node --check static/private_global_mode.js
      - run: node --check static/universal_global_mode.js
      - run: node --check static/money_opportunity_ui.js
      - run: node --check static/money_eligibility_ui.js
      - run: node --check static/money_graph_ui.js
      - run: node --check static/private_research_browser.js

  postgres-session-store:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: namemachine_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d namemachine_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: Run PostgreSQL session persistence test
        env:
          TEST_POSTGRES_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/namemachine_test
        run: python -m unittest tests.test_session_postgres -v
