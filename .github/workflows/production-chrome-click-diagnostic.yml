name: UI Click Regression

on:
  pull_request:
    paths:
      - 'static/**'
      - 'templates/**'
      - 'telegram_bootstrap.py'
      - 'tests/test_ui_cleanup_event_loop.py'
      - '.github/workflows/production-chrome-click-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chrome-click:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install app and browser driver
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          npm install --no-save puppeteer-core@24.16.0
      - name: Start branch application
        shell: bash
        run: |
          set -euo pipefail
          PORT=8080 gunicorn telegram_bootstrap:app --config gunicorn.conf.py >/tmp/namemachine.log 2>&1 &
          echo $! >/tmp/namemachine.pid
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:8080/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/namemachine.log
          exit 1
      - name: Click branch UI with system Chrome
        env:
          URL: http://127.0.0.1:8080
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || true)"
          test -n "$CHROME"
          export CHROME
          node --input-type=module <<'NODE'
          import puppeteer from 'puppeteer-core';
          const browser = await puppeteer.launch({executablePath: process.env.CHROME, headless: true, args:['--no-sandbox']});
          const page = await browser.newPage();
          await page.setViewport({width:390,height:844,isMobile:true,hasTouch:true});
          const pageErrors=[];
          page.on('pageerror', e=>pageErrors.push(String(e.stack||e)));
          const response=await page.goto(process.env.URL,{waitUntil:'domcontentloaded',timeout:15000});
          console.log('HTTP',response.status());
          await new Promise(r=>setTimeout(r,750));
          const state=await page.evaluate(()=>({
            startDisabled:document.querySelector('#startBtn')?.disabled,
            startType:typeof startSearch,
            modeButtons:document.querySelectorAll('[data-entry-mode]').length,
            bodyClasses:document.body.className,
            reportHidden:document.querySelector('#clientReportPreview')?.hidden,
            variantHidden:document.querySelector('#variantExpansionModal')?.hidden,
          }));
          console.log('STATE',JSON.stringify(state));
          const centerHit = async selector => {
            await page.$eval(selector,el=>el.scrollIntoView({block:'center',inline:'center'}));
            await new Promise(r=>setTimeout(r,50));
            return page.$eval(selector,el=>{const r=el.getBoundingClientRect();const h=document.elementFromPoint(r.left+r.width/2,r.top+r.height/2);return {tag:h?.tagName||'',id:h?.id||'',cls:h?.className||'',text:h?.textContent?.trim().slice(0,80)||'',rect:{x:r.x,y:r.y,w:r.width,h:r.height}}});
          };
          const startHit=await centerHit('#startBtn');
          console.log('START_HIT',JSON.stringify(startHit));
          await page.click('#startBtn');
          await new Promise(r=>setTimeout(r,100));
          const statusAfterStart=await page.$eval('#status',el=>el.textContent);
          console.log('STATUS_AFTER_START',statusAfterStart);
          const saveHit=await centerHit('#saveBtn');
          console.log('SAVE_HIT',JSON.stringify(saveHit));
          await page.click('#saveBtn');
          const saveOpen=await page.$eval('#saveMenu',el=>el.classList.contains('open'));
          console.log('SAVE_OPEN',saveOpen);
          const feedHit=await centerHit('.tab[data-tab="feed"]');
          console.log('FEED_HIT',JSON.stringify(feedHit));
          await page.click('.tab[data-tab="feed"]');
          await new Promise(r=>setTimeout(r,150));
          const feedState=await page.evaluate(()=>({
            active:document.querySelector('.tab[data-tab="feed"]')?.classList.contains('active'),
            hidden:document.querySelector('#feedView')?.hidden,
            activeTab:typeof activeTab==='undefined'?null:activeTab,
          }));
          console.log('FEED_STATE',JSON.stringify(feedState));
          const modeCount=await page.$$eval('[data-entry-mode]',els=>els.length);
          let modeActive=modeCount>=4;
          let modeHit={};
          if(modeCount>=4){
            modeHit=await centerHit('[data-entry-mode="generic_name"]');
            console.log('MODE_HIT',JSON.stringify(modeHit));
            await page.click('[data-entry-mode="generic_name"]');
            modeActive=await page.$eval('[data-entry-mode="generic_name"]',el=>el.classList.contains('active'));
            console.log('MODE_ACTIVE',modeActive);
          }
          console.log('PAGE_ERRORS',JSON.stringify(pageErrors));
          const startClickable=startHit.id==='startBtn';
          const saveClickable=saveHit.id==='saveBtn';
          const feedClickable=String(feedHit.cls||'').includes('tab');
          const modeClickable=modeCount<4 || String(modeHit.cls||'').includes('entry-mode');
          const ok=response.status()===200 && startClickable && saveClickable && feedClickable && modeClickable && statusAfterStart.includes('Опиши задачу') && saveOpen===true && feedState.active===true && feedState.hidden===false && modeActive===true && pageErrors.length===0;
          await browser.close();
          if(!ok) process.exit(1);
          NODE
      - name: Dump server log on failure
        if: failure()
        run: cat /tmp/namemachine.log || true
